<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash Predictor AI</title>
<style>
body{background:#0b1020;color:white;font-family:Arial;padding:20px}
h1{color:#42e8a5;text-align:center}
.card{background:#172238;padding:18px;border-radius:12px;margin:15px 0}
input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border:0;border-radius:8px}
button{background:#16bd82;font-weight:bold}
input{background:#263650;color:white}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#263650;padding:15px;text-align:center;border-radius:8px}
strong{display:block;color:#42e8a5;font-size:22px;margin-top:8px}
li{padding:10px;border-bottom:1px solid #34435a}
</style>
</head>
<body>

<h1>CRASH PREDICTOR AI</h1>
<p style="text-align:center">Analyseur statistique Aviator</p>

<div class="card">
<h3>Ajouter un résultat</h3>
<input id="value" type="number" step="0.01" min="1" placeholder="Exemple : 2.45">
<button onclick="add()">ENREGISTRER</button>
</div>

<div class="card">
<h3>Statistiques</h3>
<div class="stats">
<div class="stat">Manches<strong id="total">0</strong></div>
<div class="stat">Moyenne<strong id="avg">0x</strong></div>
<div class="stat">Sous 2x<strong id="low">0%</strong></div>
<div class="stat">2x et plus<strong id="high">0%</strong></div>
</div>
</div>

<div class="card">
<h3>Analyse</h3>
<p id="analysis">En attente de résultats.</p>
</div>

<div class="card">
<h3>Historique</h3>
<ul id="history"></ul>
<button onclick="clearAll()" style="background:#c74343;color:white">EFFACER</button>
</div>

<script>
let results=JSON.parse(localStorage.getItem("crashData")||"[]");

function add(){
let v=parseFloat(document.getElementById("value").value);
if(!Number.isFinite(v)||v<1){alert("Résultat invalide");return;}
results.unshift(v);
document.getElementById("value").value="";
save();
}

function save(){
localStorage.setItem("crashData",JSON.stringify(results));
render();
}

function render(){
let n=results.length;
let low=results.filter(x=>x<2).length;
let avg=n?results.reduce((a,b)=>a+b,0)/n:0;

document.getElementById("total").textContent=n;
document.getElementById("avg").textContent=avg.toFixed(2)+"x";
document.getElementById("low").textContent=n?(low/n*100).toFixed(1)+"%":"0%";
document.getElementById("high").textContent=n?((n-low)/n*100).toFixed(1)+"%":"0%";

document.getElementById("analysis").textContent=n?
low+" résultats sous 2x sur "+n+" manches. Ces statistiques ne prédisent pas le prochain crash.":
"En attente de résultats.";

document.getElementById("history").innerHTML=results.slice(0,30).map(x=>"<li>"+x.toFixed(2)+"x</li>").join("");
}

function clearAll(){
if(confirm("Effacer tout l'historique ?")){results=[];save();}
}

render();
</script>
</body>
  </html>
